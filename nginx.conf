server {
    # IPv4 only: an IPv6 listen fails to start on hosts with IPv6 disabled
    listen 3001;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Astro static output: /registro -> /registro/index.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Hashed build assets can be cached for a long time
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
